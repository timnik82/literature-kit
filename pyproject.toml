[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-kit"
dynamic = ["version"]
description = "Project-independent scholarly literature tools: OpenAlex, Semantic Scholar, CORE and Europe PMC with saved audits."
readme = "README.md"
authors = [{ name = "timnik82" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/timnik82/literature-kit"

# Single source of truth for dev dependencies, installed by `uv sync`.
# pip-only contributors: create a venv, `pip install -e .`, then `pip install 'pytest>=8'`.
[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
litkit = "literature_kit.papers:main"
# Kept as an alias for existing installs and scripts.
literature-kit = "literature_kit.papers:main"

[tool.setuptools.dynamic]
version = { attr = "literature_kit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
