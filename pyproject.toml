[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-kit"
dynamic = ["version"]
description = "Project-independent scholarly literature tools: OpenAlex, Semantic Scholar, CORE and Europe PMC with saved audits."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
literature-kit = "literature_kit.papers:main"

[tool.setuptools.dynamic]
version = { attr = "literature_kit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
